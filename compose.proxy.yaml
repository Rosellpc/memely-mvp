services:
  web:
    ports: !reset []

  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${MEMELY_PORT:-8080}:80"
      - "127.0.0.1:8443:443"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./.certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped