name: Validate application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Comprobar sintaxis de JavaScript
        run: node --check js/app.js

      - name: Ejecutar pruebas Alpine y validar esquema
        run: |
          docker compose -p memely-test \
            -f compose.test.yaml \
            -f compose.test.alpine.yaml \
            up --build --abort-on-container-exit --exit-code-from test

      - name: Construir imagen de ejecución Alpine
        run: |
          docker build \
            -f Dockerfile.alpine \
            --target runtime \
            -t memely:ci \
            .

      - name: Limpiar entorno de pruebas
        if: always()
        run: |
          docker compose -p memely-test \
            -f compose.test.yaml \
            -f compose.test.alpine.yaml \
            down -v
